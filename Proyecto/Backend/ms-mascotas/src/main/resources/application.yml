server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-mascotas

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}

  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

ms-usuarios:
  url: ${MS_USUARIOS_URL:http://localhost:8081}

ms-citas-medicas:
  url: ${MS_CITAS_MEDICAS_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never