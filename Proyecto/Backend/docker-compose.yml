services:

  gateway:
    build: ./api-gateway
    container_name: petdate-api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      ms-usuarios:
        condition: service_started
      ms-mascotas:
        condition: service_started
      ms-servicios:
        condition: service_started
      ms-citas-medicas:
        condition: service_started
    restart: unless-stopped
    networks:
      - petdate-network

  ms-usuarios:
    build:
      context: ./ms-usuarios
      dockerfile: Dockerfile
    container_name: petdate-ms-usuarios
    expose:
      - "8081"
    environment:
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_MONGODB_URI: mongodb://petdate-db:27017/db-PetDate
      spring.data.mongodb.uri: mongodb://petdate-db:27017/db-PetDate
      MS_MASCOTAS_URL: http://ms-mascotas:8082
      MS_CITAS_MEDICAS_URL: http://ms-citas-medicas:8084
    restart: on-failure
    networks:
      - petdate-network

  ms-mascotas:
    build:
      context: ./ms-mascotas
      dockerfile: Dockerfile
    container_name: petdate-ms-mascotas
    expose:
      - "8082"
    environment:
      SERVER_PORT: 8082
      MS_USUARIOS_URL: http://ms-usuarios:8081
      MS_CITAS_MEDICAS_URL: http://ms-citas-medicas:8084
      SPRING_DATA_MONGODB_URI: mongodb://petdate-db:27017/db-PetDate
      spring.data.mongodb.uri: mongodb://petdate-db:27017/db-PetDate
    restart: on-failure
    networks:
      - petdate-network
    volumes:
      - mascotas-uploads:/app/uploads/mascotas

  ms-servicios:
    build:
      context: ./ms-servicios
      dockerfile: Dockerfile
    container_name: petdate-ms-servicios
    expose:
      - "8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATA_MONGODB_URI: mongodb://petdate-db:27017/db-PetDate
      spring.data.mongodb.uri: mongodb://petdate-db:27017/db-PetDate
      JWT_SECRET: ${JWT_SECRET}
    restart: on-failure
    networks:
      - petdate-network

  ms-citas-medicas:
    build:
      context: ./ms-citas-medicas
      dockerfile: Dockerfile
    container_name: petdate-ms-citas-medicas
    expose:
      - "8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATA_MONGODB_URI: mongodb://petdate-db:27017/db-PetDate
      spring.data.mongodb.uri: mongodb://petdate-db:27017/db-PetDate
      MS_MASCOTAS_URL: http://ms-mascotas:8082
      MS_USUARIOS_URL: http://ms-usuarios:8081
    restart: on-failure
    networks:
      - petdate-network

volumes:
  mascotas-uploads:

networks:
  petdate-network:
    external: true