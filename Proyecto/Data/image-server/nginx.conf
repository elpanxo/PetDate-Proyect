server {
    listen 80;
    server_name _;

    # Servidor de imagenes compartido de PetDate.
    # Sirve los archivos subidos por los microservicios (ms-mascotas, ms-servicios, etc.)
    # desde un volumen Docker compartido. Solo lectura: la escritura la hace
    # cada microservicio directamente sobre el volumen montado.
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        autoindex off;

        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=604800";

        # Si el archivo no existe, 404 simple (sin exponer el listado del directorio)
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
